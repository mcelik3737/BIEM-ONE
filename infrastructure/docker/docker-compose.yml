services:
  postgres:
    image: postgres:16-alpine
    container_name: biem-one-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: biem_one
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - biem-one-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: biem-one-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - biem-one-redis:/data

  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: biem-one-api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/biem_one?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN_DAYS: 7
    ports:
      - "3000:3000"

volumes:
  biem-one-postgres:
  biem-one-redis:
